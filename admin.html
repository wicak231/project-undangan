<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan - Wicak & Dyah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pustaka SheetJS untuk membaca file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-stone-800 border border-amber-600/30 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-amber-500 mb-1">Generator Link Undangan</h1>
            <p class="text-xs text-stone-400">Buat tautan & pesan WhatsApp untuk tamu undangan secara otomatis</p>
        </div>

        <!-- Domain / Base URL Config -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-amber-400 uppercase tracking-wider mb-2">Domain / Base URL Undangan</label>
            <input type="text" id="base-url" class="w-full bg-stone-900 border border-stone-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
        </div>

        <!-- Mode Selector Tab -->
        <div class="flex border-b border-stone-700 mb-6 text-xs font-semibold overflow-x-auto">
            <button id="tab-single" class="py-2 px-4 border-b-2 border-amber-500 text-amber-400 focus:outline-none whitespace-nowrap">
                <i class="fa-solid fa-user mr-1"></i> Satu Nama
            </button>
            <button id="tab-bulk" class="py-2 px-4 border-b-2 border-transparent text-stone-400 hover:text-stone-200 focus:outline-none whitespace-nowrap">
                <i class="fa-solid fa-users mr-1"></i> Banyak Nama (Teks)
            </button>
            <button id="tab-excel" class="py-2 px-4 border-b-2 border-transparent text-stone-400 hover:text-stone-200 focus:outline-none whitespace-nowrap">
                <i class="fa-solid fa-file-excel mr-1 text-emerald-500"></i> Upload Excel (.xlsx / .csv)
            </button>
        </div>

        <!-- FORM 1: INPUT SINGLE -->
        <div id="form-single" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-stone-300 mb-1">Nama Tamu</label>
                    <input type="text" id="guest-single" placeholder="Contoh: Bapak Ahmad" class="w-full bg-stone-900 border border-stone-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-300 mb-1">Alamat / Keterangan (Opsional)</label>
                    <input type="text" id="addr-single" placeholder="Contoh: di Tempat / Caruban" class="w-full bg-stone-900 border border-stone-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                </div>
            </div>
            <button id="btn-gen-single" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2.5 rounded-lg text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Buat Link & Pesan WA
            </button>
        </div>

        <!-- FORM 2: INPUT BULK (TEKS) -->
        <div id="form-bulk" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-stone-300 mb-1">Daftar Nama Tamu (Satu Nama Per Baris)</label>
                <textarea id="guest-bulk" rows="6" placeholder="Contoh:&#10;Bapak Ahmad, di Tempat&#10;Ibu Susi, Caruban&#10;Sdr. Budi, Madiun" class="w-full bg-stone-900 border border-stone-700 rounded-lg p-3 text-xs font-mono focus:outline-none focus:border-amber-500"></textarea>
            </div>
            <button id="btn-gen-bulk" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2.5 rounded-lg text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> Generate Semua Link
            </button>
        </div>

        <!-- FORM 3: UPLOAD EXCEL -->
        <div id="form-excel" class="space-y-4 hidden">
            <div class="bg-stone-900/60 border-2 border-dashed border-stone-700 rounded-xl p-6 text-center hover:border-amber-500/50 transition-colors">
                <i class="fa-solid fa-file-excel text-4xl text-emerald-500 mb-3"></i>
                <p class="text-xs text-stone-300 mb-2 font-semibold">Pilih atau Seret File Excel (.xlsx / .xls / .csv)</p>
                <p class="text-[11px] text-stone-500 mb-4">*Kolom pertama (A) = Nama Tamu, Kolom kedua (B) = Alamat (Opsional)</p>
                <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden">
                <button onclick="document.getElementById('excel-file').click()" class="bg-stone-700 hover:bg-stone-600 text-stone-200 text-xs px-4 py-2 rounded-lg font-semibold border border-stone-600">
                    <i class="fa-solid fa-folder-open mr-1"></i> Pilih File Excel
                </button>
                <p id="file-name" class="text-xs text-amber-400 mt-3 font-mono"></p>
            </div>
            <button id="btn-gen-excel" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-import"></i> Proses File Excel
            </button>
        </div>

        <hr class="border-stone-700 my-6">

        <!-- OUTPUT SINGLE RESULT -->
        <div id="result-single" class="hidden space-y-4 bg-stone-900 p-5 rounded-xl border border-stone-700">
            <div class="flex justify-between items-center">
                <h3 id="res-name" class="font-bold text-amber-400 text-lg"></h3>
                <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full">Siap Kirim</span>
            </div>
            <div>
                <label class="block text-[11px] text-stone-400 mb-1">URL Undangan Khusus:</label>
                <div class="flex gap-2">
                    <input type="text" id="res-link" readonly class="w-full bg-stone-800 text-xs px-3 py-2 rounded border border-stone-700 text-stone-300">
                    <button onclick="copyText('res-link')" class="bg-stone-700 hover:bg-stone-600 px-3 py-2 rounded text-xs text-stone-200">
                        <i class="fa-regular fa-copy"></i> Salin
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-[11px] text-stone-400 mb-1">Draft Pesan WhatsApp:</label>
                <textarea id="res-message" rows="5" readonly class="w-full bg-stone-800 text-xs p-3 rounded border border-stone-700 text-stone-300 font-mono"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="copyText('res-message')" class="flex-1 bg-stone-700 hover:bg-stone-600 py-2.5 rounded-lg text-xs font-semibold text-stone-200 flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i> Salin Pesan WA
                </button>
                <a id="res-wa-btn" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-xs font-semibold text-white flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Kirim ke WhatsApp
                </a>
            </div>
        </div>

        <!-- OUTPUT BULK / EXCEL RESULT TABLE -->
        <div id="result-bulk" class="hidden space-y-3">
            <h3 class="font-bold text-amber-400 text-sm flex items-center justify-between">
                <span>Daftar Undangan Dihasilkan (<span id="bulk-count">0</span>)</span>
            </h3>
            <div class="overflow-x-auto max-h-96 border border-stone-700 rounded-xl">
                <table class="w-full text-left text-xs text-stone-300 bg-stone-900">
                    <thead class="bg-stone-950 text-amber-400 uppercase text-[10px] tracking-wider sticky top-0">
                        <tr>
                            <th class="p-3">No</th>
                            <th class="p-3">Nama Tamu</th>
                            <th class="p-3">Alamat</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bulk-table-body" class="divide-y divide-stone-800"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrlInput = document.getElementById('base-url');
            
            // Set Base URL Otomatis
            let currentUrl = window.location.href.split('?')[0].replace('admin.html', '').replace('generator.html', '');
            if (window.location.protocol === 'file:') {
                if (!currentUrl.endsWith('index.html')) {
                    currentUrl = currentUrl.endsWith('/') ? currentUrl + 'index.html' : currentUrl + '/index.html';
                }
            } else {
                if (currentUrl.endsWith('/')) currentUrl = currentUrl.slice(0, -1);
            }
            baseUrlInput.value = currentUrl;

            // Tab Navigation
            const tabSingle = document.getElementById('tab-single');
            const tabBulk = document.getElementById('tab-bulk');
            const tabExcel = document.getElementById('tab-excel');

            const formSingle = document.getElementById('form-single');
            const formBulk = document.getElementById('form-bulk');
            const formExcel = document.getElementById('form-excel');

            const resSingle = document.getElementById('result-single');
            const resBulk = document.getElementById('result-bulk');

            function resetTabs() {
                [tabSingle, tabBulk, tabExcel].forEach(t => t.classList.replace('border-amber-500', 'border-transparent'));
                [tabSingle, tabBulk, tabExcel].forEach(t => t.classList.replace('text-amber-400', 'text-stone-400'));
                [formSingle, formBulk, formExcel].forEach(f => f.classList.add('hidden'));
                resSingle.classList.add('hidden');
                resBulk.classList.add('hidden');
            }

            tabSingle.addEventListener('click', () => {
                resetTabs();
                tabSingle.classList.replace('border-transparent', 'border-amber-500');
                tabSingle.classList.replace('text-stone-400', 'text-amber-400');
                formSingle.classList.remove('hidden');
            });

            tabBulk.addEventListener('click', () => {
                resetTabs();
                tabBulk.classList.replace('border-transparent', 'border-amber-500');
                tabBulk.classList.replace('text-stone-400', 'text-amber-400');
                formBulk.classList.remove('hidden');
            });

            tabExcel.addEventListener('click', () => {
                resetTabs();
                tabExcel.classList.replace('border-transparent', 'border-amber-500');
                tabExcel.classList.replace('text-stone-400', 'text-amber-400');
                formExcel.classList.remove('hidden');
            });

            // Single Generator
            document.getElementById('btn-gen-single').addEventListener('click', () => {
                const name = document.getElementById('guest-single').value.trim();
                const addr = document.getElementById('addr-single').value.trim();
                const baseUrl = getCleanBaseUrl();

                if (!name) return alert('Isi nama tamu terlebih dahulu!');

                const { link, message } = createInvitation(baseUrl, name, addr);

                document.getElementById('res-name').innerText = name + (addr ? ` (${addr})` : '');
                document.getElementById('res-link').value = link;
                document.getElementById('res-message').value = message;
                document.getElementById('res-wa-btn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;

                resSingle.classList.remove('hidden');
            });

            // Bulk Text Generator
            document.getElementById('btn-gen-bulk').addEventListener('click', () => {
                const rawText = document.getElementById('guest-bulk').value.trim();
                if (!rawText) return alert('Isi daftar nama tamu terlebih dahulu!');

                const lines = rawText.split('\n').filter(line => line.trim() !== '');
                const listData = lines.map(line => {
                    const parts = line.split(',');
                    return {
                        name: parts[0].trim(),
                        addr: parts[1] ? parts[1].trim() : ''
                    };
                });

                renderBulkTable(listData);
            });

            // File Excel Upload
            const excelFileInput = document.getElementById('excel-file');
            excelFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById('file-name').innerText = `File terpilih: ${file.name}`;
                }
            });

            document.getElementById('btn-gen-excel').addEventListener('click', () => {
                const file = excelFileInput.files[0];
                if (!file) return alert('Pilih file Excel terlebih dahulu!');

                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Ambil Sheet Pertama
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Konversi Sheet ke JSON (Array of Array)
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    if (!rows || rows.length === 0) {
                        return alert('File Excel kosong!');
                    }

                    const listData = [];
                    rows.forEach((row) => {
                        if (row && row.length > 0 && row[0]) {
                            const name = String(row[0]).trim();
                            const addr = row[1] ? String(row[1]).trim() : '';
                            
                            // Abaikan baris header jika tulisan "Nama" / "Nama Tamu"
                            if (name.toLowerCase() !== 'nama' && name.toLowerCase() !== 'nama tamu') {
                                listData.push({ name, addr });
                            }
                        }
                    });

                    if (listData.length === 0) {
                        return alert('Tidak ada data nama tamu yang valid di dalam file Excel!');
                    }

                    renderBulkTable(listData);
                };

                reader.readAsArrayBuffer(file);
            });

            function renderBulkTable(listData) {
                const baseUrl = getCleanBaseUrl();
                const tableBody = document.getElementById('bulk-table-body');
                tableBody.innerHTML = '';

                listData.forEach((item, index) => {
                    if (item.name) {
                        const { link, message } = createInvitation(baseUrl, item.name, item.addr);
                        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;

                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-stone-800/50';
                        tr.innerHTML = `
                            <td class="p-3 text-stone-500">${index + 1}</td>
                            <td class="p-3 font-semibold text-stone-200">${escapeHtml(item.name)}</td>
                            <td class="p-3 text-stone-400">${escapeHtml(item.addr || '-')}</td>
                            <td class="p-3 text-center space-x-1">
                                <button onclick="copyDirect('${escapeJs(link)}')" title="Salin Link" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 px-2 py-1 rounded text-[11px]">
                                    <i class="fa-regular fa-copy"></i> Link
                                </button>
                                <button onclick="copyDirect('${escapeJs(message)}')" title="Salin Pesan WA" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 px-2 py-1 rounded text-[11px]">
                                    <i class="fa-solid fa-message"></i> WA
                                </button>
                                <a href="${waUrl}" target="_blank" title="Kirim WA" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded text-[11px] inline-block">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </a>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    }
                });

                document.getElementById('bulk-count').innerText = listData.length;
                resBulk.classList.remove('hidden');
            }

            function getCleanBaseUrl() {
                let url = baseUrlInput.value.trim();
                if (url.endsWith('/')) url = url.slice(0, -1);
                return url;
            }

            function createInvitation(baseUrl, name, addr) {
                let link = `${baseUrl}/?to=${encodeURIComponent(name)}`;
                if (addr) link += `&addr=${encodeURIComponent(addr)}`;

                const addrText = addr ? `\n${addr}` : '';
                const message = `Assalamu’alaikum Wr. Wb. / Salam Sejahtera\n\nKatur Bapa/Ibu/Sadherek:\n*${name}*${addrText}\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Bapa/Ibu/Sadherek untuk menghadiri acara Pawiwahan Ageng pernikahan kami (Wicak & Dyah).\n\nBerikut tautan undangan digital kami untuk informasi lengkap acara:\n${link}\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapa/Ibu/Sadherek berkenan hadir dan memberikan doa restu.\n\nMatur Nuwun / Terima Kasih.\n\n*Wicak & Dyah*`;

                return { link, message };
            }
        });

        // Global Utility Functions
        window.copyText = function(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                navigator.clipboard.writeText(el.value).then(() => {
                    alert('Berhasil disalin!');
                }).catch(() => {
                    el.select();
                    document.execCommand('copy');
                    alert('Berhasil disalin!');
                });
            }
        };

        window.copyDirect = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Berhasil disalin ke clipboard!');
            });
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }
    </script>
</body>
</html>
